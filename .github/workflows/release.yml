name: Publish signed desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and application version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }
          $configuredKey = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          $releaseKey = (Get-Content updater/public.key -Raw).Trim()
          if ($configuredKey -ne $releaseKey) { throw "Updater public-key files do not match" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm check
      - run: pnpm --filter @local-agent-stack/harness-companion test
      - name: Build signature-enforced updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build
      - name: Verify updater signature independently
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          cargo run -p local-stack-core --example verify_update_signature -- $setup.FullName "$($setup.FullName).sig" updater/public.key
      - name: Prepare release assets and update manifest
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          $signature = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw "Updater signature was not produced" }
          $asset = "Local-Agent-Stack_$env:APP_VERSION`_windows-x86_64-setup.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $asset
          Copy-Item -LiteralPath $setup.FullName -Destination $assetPath
          Copy-Item -LiteralPath $signature -Destination "$assetPath.sig"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$env:APP_VERSION" }
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$asset"
          $manifest = [ordered]@{
            version = $env:APP_VERSION
            notes = "Signed Local Agent Stack $env:APP_VERSION desktop update"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -LiteralPath "$assetPath.sig" -Raw).Trim()
                url = $download
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "latest.json")
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "UPDATE_ASSET=$assetPath" >> $env:GITHUB_ENV
      - name: Publish prerelease and signed update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Local Agent Stack $env:APP_VERSION" --generate-notes --prerelease
          }
          gh release upload $env:RELEASE_TAG $env:UPDATE_ASSET "$env:UPDATE_ASSET.sig" "$env:RUNNER_TEMP/latest.json" --clobber
      - name: Advance the signature-protected update channel
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch main
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/latest.json" -Destination updater/latest.json
          git add updater/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: advance signed updater to $env:APP_VERSION"
            git push origin main
          }
