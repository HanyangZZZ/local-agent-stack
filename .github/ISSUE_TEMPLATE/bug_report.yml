name: Bug report
description: Report a reproducible Local Agent Stack problem
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: >-
        Remove credentials and private prompts before attaching diagnostics or traces.
        Security vulnerabilities must be reported privately under SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Local Agent Stack version
      placeholder: 0.1.1-alpha.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, GPU, driver, Ollama version and Harness version.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics or screenshots
      description: Attach only data you have reviewed and are comfortable publishing.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, launch tokens, private prompts and personal paths.
          required: true
